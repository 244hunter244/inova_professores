<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inova</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Login do Professor</h2>
    <form id="formLogin">
      <div class="input-group">
        <label for="nome_completo">Nome Completo</label>
        <input type="text" id="nome_completo" required placeholder="Digite seu nome completo">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>

    <p class="link-rodape">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
