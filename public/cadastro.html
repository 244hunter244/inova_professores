<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Professores - Inova</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Cadastro de Professor</h2>
    <form id="formCadastro">
      <div class="input-group">
        <label for="nome_completo">Nome Completo</label>
        <input type="text" id="nome_completo" required placeholder="Ex: Maria Silva">
      </div>

      <div class="input-group">
        <label for="materia">Matéria</label>
        <input type="text" id="materia" required placeholder="Ex: Matemática">
      </div>

      <div class="input-group">
        <label for="idade">Idade</label>
        <input type="number" id="idade" required placeholder="Ex: 35">
      </div>

      <div class="input-group">
        <label for="rg">RG</label>
        <input type="text" id="rg" required placeholder="Ex: 12.345.678-9">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
      </div>

      <button type="submit" id="btnCadastrar">Cadastrar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
